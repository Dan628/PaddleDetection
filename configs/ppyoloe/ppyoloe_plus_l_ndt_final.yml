_BASE_: [
  '../datasets/ndt_detection.yml',
  '../runtime.yml',
  './_base_/ppyoloe_plus_crn.yml',
  './_base_/ppyoloe_plus_reader.yml',
]

log_iter: 100
snapshot_epoch: 5
weights: output/ppyoloe_plus_l_ndt/model_final
epoch: 80

pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/pretrained/ppyoloe_crn_l_obj365_pretrained.pdparams
depth_mult: 1.0
width_mult: 1.0

# 1. OPTIMIZER - Add AdamW (tested and working)
OptimizerBuilder:
  optimizer:
    !AdamW
    weight_decay: 0.05
    beta1: 0.9
    beta2: 0.999
  regularizer: null

LearningRate:
  base_lr: 0.0001
  schedulers:
    - !CosineDecay
      max_epochs: 96
    - !LinearWarmup
      start_factor: 0.
      epochs: 5

# 2. WANDB - Add logging
use_wandb: true
wandb:
  project: NDT-Defect-Detection
  name: ppyoloe_plus_l_adamw

# 3. AUGMENTATIONS - Override ONLY the transforms, keep everything else
TrainReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}  # Force 640x640 before Mosaic
    - Mosaic:
        prob: 1.0
        input_dim: [640, 640]
        degrees: [-15, 15]
        translate: [-0.2, 0.2]
        scale: [0.5, 1.5]
        shear: [-2.0, 2.0]
        enable_mixup: true
        mixup_prob: 0.15
        mixup_scale: [0.5, 1.5]
    - AugmentHSV:
        hgain: 0.015
        sgain: 0.35
        vgain: 0.30
        fraction: 1.0
    - RandomDistort:
        brightness: [0.8, 1.2, 0.5]
        contrast: [0.8, 1.2, 0.5]
        saturation: [0.8, 1.2, 0.5]
        hue: [-10, 10, 0.5]
        prob: 0.2
    - RandomExpand: {fill_value: [114, 114, 114]}
    - RandomCrop: {}
    - RandomFlip: {prob: 0.5}

  batch_transforms:
    - BatchRandomResize:
        target_size: [512, 544, 576, 608, 640, 672, 704]
        random_size: True
        random_interp: True
        keep_ratio: True
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}

  # CRITICAL: Keep ALL these fields that PaddleDetection expects!
  batch_size: 16
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true
  worker_num: 4  # DON'T FORGET THIS!