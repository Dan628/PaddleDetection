_base_: [
  '../datasets/ndt_detection.yml', # Use our custom dataset
  '../runtime.yml',
  '_base_/ppyoloe_plus_crn.yml',
  '_base_/optimizer_80e.yml',
  '_base_/ppyoloe_plus_reader.yml',
]

# Model scaling for PP-YOLOE+-L
depth_mult: 1.0
width_mult: 1.0

# Pretrained weights from COCO (helps convergence)
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/ppyoloe_plus_crn_l_80e_coco.pdparams
weights: output/ppyoloe_plus_l_ndt/model_final

# Training settings
epoch: 80
snapshot_epoch: 5
log_iter: 50
eval_interval: 5
use_gpu: true
save_dir: output/ppyoloe_plus_l_ndt

# Optional: Override optimizer for better fine-tuning
# Uncomment below to use AdamW instead of SGD+Momentum
# OptimizerBuilder:
#   optimizer:
#     type: AdamW
#     weight_decay: 0.05
#     beta1: 0.9
#     beta2: 0.999
#   regularizer: null
#
# LearningRate:
#   base_lr: 0.0001  # Lower for AdamW
#   schedulers:
#     - name: CosineDecay
#       max_epochs: 96
#     - name: LinearWarmup
#       start_factor: 0.
#       epochs: 5

# Add wandb integration
wandb:
  project: NDT-Defect-Detection
  name: ppyoloe_plus_l_heavy_aug_run

# Define Heavy Augmentation Pipeline
TrainReader:
  sample_transforms:
    - Decode: {}

    # Mosaic with internal MixUp (simple & safe)
    - Mosaic:
        prob: 1.0
        input_dim: [640, 640]
        degrees: [-15, 15]
        translate: [-0.2, 0.2]
        scale: [0.5, 1.5]
        shear: [-2.0, 2.0]
        enable_mixup: true
        mixup_prob: 0.15           # ≈ your YOLOv8 mixup
        mixup_scale: [0.5, 1.5]

    # Color jitter (Ultralytics-like strength on OpenCV HSV scale)
    - AugmentHSV:
        hgain: 0.015    # Converted to 0-1 range
        sgain: 0.35     # Converted to 0-1 range
        vgain: 0.30     # Converted to 0-1 range
        fraction: 1.0   # Always apply

    # Mild extra photometric jitter at low prob (optional, not overcooked)
    - RandomDistort:
        brightness: [0.8, 1.2, 0.5]
        contrast: [0.8, 1.2, 0.5]
        saturation: [0.8, 1.2, 0.5]
        hue: [-10, 10, 0.5]
        prob: 0.2

    # Gentle blur
    - RandomGaussianBlur: {prob: 0.25, sigma: [0.3, 1.0]}

    # Very light regularization
    - RandomErasing: {prob: 0.15, scale: [0.02, 0.12], ratio: [0.3, 3.3]}

    # Canvas expand + basic flip
    - RandomExpand: {fill_value: [114, 114, 114]}
    - RandomCrop: {}
    - RandomFlip: {prob: 0.5}      # (no vertical flip)

  batch_transforms:
    - BatchRandomResize:
        target_size: [512, 544, 576, 608, 640, 672, 704]
        random_size: True
        random_interp: True
        keep_ratio: True
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
    - PadGT: {}

  batch_size: 8
  worker_num: 4
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true

# Eval reader with 640x640 size
EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 2

TestReader:
  inputs_def:
    image_shape: [3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1

# Update num_classes for NDT dataset (9 defect classes)
PPYOLOEHead:
  num_classes: 9

# (VarifocalLoss is used by default via use_varifocal_loss: True in ppyoloe_plus_crn.yml)