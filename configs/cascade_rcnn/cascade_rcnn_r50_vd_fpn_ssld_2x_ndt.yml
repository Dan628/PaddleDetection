_BASE_: [
  '../datasets/ndt_detection.yml',  # Use NDT dataset
  '../runtime.yml',
  '_base_/optimizer_1x.yml',
  '_base_/cascade_rcnn_r50_fpn.yml',
  '_base_/cascade_fpn_reader.yml',
]

# Use SSLD distilled ResNet50-vd for better accuracy
pretrain_weights: https://paddledet.bj.bcebos.com/models/pretrained/ResNet50_vd_ssld_v2_pretrained.pdparams
weights: output/cascade_rcnn_r50_vd_fpn_ssld_2x_ndt/model_final

# ResNet50-vd backbone configuration
ResNet:
  depth: 50
  variant: d  # ResNet-D variant (better)
  norm_type: bn
  freeze_at: 0  # Don't freeze any layers
  return_idx: [0,1,2,3]
  num_stages: 4
  lr_mult_list: [0.05, 0.05, 0.1, 0.15]  # Layer-wise LR multipliers

# Update for 9 NDT defect classes
BBoxHead:
  head: CascadeHead
  roi_extractor:
    resolution: 7
    sampling_ratio: 0
    aligned: True
  bbox_assigner: BBoxAssigner
  num_classes: 9  # NDT defect classes

CascadeHead:
  num_cascade_stages: 3
  reg_class_agnostic: True
  stage_loss_weights: [1, 0.5, 0.25]
  bbox_loss_weight: [10, 10, 10]
  num_classes: 9  # NDT defect classes

# Training settings
epoch: 80  # Longer for NDT (was 24 for COCO)
snapshot_epoch: 5
eval_interval: 5
log_iter: 50
use_gpu: true
save_dir: output/cascade_rcnn_r50_vd_fpn_ssld_2x_ndt

LearningRate:
  base_lr: 0.001  # Lower for fine-tuning (was 0.01)
  schedulers:
  - !PiecewiseDecay
    gamma: 0.1
    milestones: [50, 70]  # Adjusted for 80 epochs
  - !LinearWarmup
    start_factor: 0.1
    steps: 1000

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    type: Momentum
  regularizer:
    factor: 0.0001
    type: L2

# WandB integration
wandb:
  project: NDT-Defect-Detection
  name: cascade_rcnn_r50_vd_fpn_ssld_2x_ndt_run

# Data augmentation for Cascade R-CNN (more conservative than YOLO)
TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomResize: {target_size: [[640, 1333], [672, 1333], [704, 1333], [736, 1333], [768, 1333], [800, 1333]], keep_ratio: True, interp: 1}
    - RandomFlip: {prob: 0.5}
    - NormalizeImage: {is_scale: True, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 2  # Cascade R-CNN uses more memory
  shuffle: true
  drop_last: true
  worker_num: 4

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {interp: 1, target_size: [800, 1333], keep_ratio: True}
    - NormalizeImage: {is_scale: True, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 1

TestReader:
  inputs_def:
    image_shape: [3, 800, 1333]
    im_shape: [3, 800, 1333]
    scale_factor: [2, 1.0, 1.0]
  sample_transforms:
    - Decode: {}
    - Resize: {interp: 1, target_size: [800, 1333], keep_ratio: True}
    - NormalizeImage: {is_scale: True, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 1